name: Construire Bloqueur Shorts (APK)

on:
  push:
    paths:
      - 'bloqueur-shorts/**'
      - '.github/workflows/build-bloqueur.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bloqueur-shorts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Construire l'APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bloqueur-shorts-apk
          path: bloqueur-shorts/app/build/outputs/apk/debug/app-debug.apk
