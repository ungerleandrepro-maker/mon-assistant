name: Cahier app (Android)

on:
  push:
    branches: [cahier-app]
    paths: ["cahier-app/**", ".github/workflows/cahier-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cahier-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Construire l'APK
        run: gradle --no-daemon assembleRelease
      - name: Renommer
        run: cp app/build/outputs/apk/release/app-release.apk ../le-cahier.apk
      - uses: actions/upload-artifact@v4
        with:
          name: le-cahier-apk
          path: le-cahier.apk
      - name: Publier la version
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cahier-v${{ github.run_number }}
          name: Le cahier ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: "App Android du cahier. Sur ton téléphone, télécharge le-cahier.apk ci-dessous et ouvre-le pour l'installer."
          files: le-cahier.apk
